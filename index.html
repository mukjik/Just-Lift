function parseLocalDate(iso){const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d,12)}
function offsetDate(iso,n){const d=parseLocalDate(iso);d.setDate(d.getDate()+n);return localISO(d)}
function weekday(iso){return ['일','월','화','수','목','금','토'][parseLocalDate(iso).getDay()]+'요일'}
function validDate(iso){return /^\\d{4}-\\d{2}-\\d{2}$/.test(iso)&&localISO(parseLocalDate(iso))===iso}

function setFirstWorkoutDate(v){if(!validDate(v))return;db.firstWorkoutDate=v;persist();render()}
function workoutDate(cy,w,d){return db.firstWorkoutDate?offsetDate(db.firstWorkoutDate,((cy-1)*6+(w-1))*28+[0,2,4,6][d]):null}
function restScreen(){
 const state=db.restState;
 if(!state){$('betweenDays').classList.add('hidden');$('workout').classList.remove('hidden');return}
 $('workout').classList.add('hidden');$('betweenDays').classList.remove('hidden');
 const next=offsetDate(state.finishedDate,1);
 $('restDate').textContent=`${state.finishedDate} · ${weekday(state.finishedDate)}`;
 $('nextDayLabel').textContent=state.wasDay4?`내일 ${next} (${weekday(next)}) · ${state.nextSheet}`:`내일 ${next} (${weekday(next)}) · 러닝`;
}
function advanceRest(){db.restState=null;persist();restScreen();render()}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){$('storageWarning').textContent='현재 환경에서는 영구 저장이 제한됩니다. JSON으로 백업하세요.'}}
function current(){let d=+$('day').value,w=+$('week').value-1;return {d,w,e:DATA[d].exercises[index],key:ensureSuggested(w+1,d,index),group:`C${cycle}-${w+1}-${d}`}}
function resetExercise(){index=0;render()}
function validNumber(v){return v!==''&&Number.isFinite(Number(v))&&Number(v)>=0}
function escapeHtml(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const {d,w,e,key,group}=current(),t=e.targets[w],v=store[key]||{};
$('firstDateRow').style.display=(cycle===1&&w===0&&d===0&&index===0)?'block':'none';
 $('firstWorkoutDate').value=db.firstWorkoutDate;
 const scheduled=workoutDate(cycle,w+1,d);$('subtitle').textContent=(scheduled?scheduled+' ('+weekday(scheduled)+') · ':'')+DATA[d].subtitle;$('counter').textContent=(index+1)+'/'+DATA[d].exercises.length;$('position').textContent='EXERCISE '+(index+1);$('name').textContent=e.name;$('kind').textContent=e.kind;$('kind').className='tag '+e.kind;
['sets','reps','rpe'].forEach(x=>$(x).textContent=t[x]||'원본 미지정');$('rest').textContent='REST: '+(t.rest||'원본 미지정');$('missing').classList.toggle('hidden',!!t.reps);
$('weight').value=v.mode==='bw'?'0':(v.weight??'');$('actualRpe').value=v.rpe??'';$('notes').value=v.notes||'';
let n=Math.max(1,parseInt(t.sets)||3);$('repFields').innerHTML=Array.from({length:n},(_,i)=>`<div><label style="text-align:center">Set ${i+1}</label><input type="number" min="0" step="1" inputmode="numeric" placeholder="Reps" value="${escapeHtml((v.reps||[])[i]??'')}" oninput="save()"></div>`).join('');
let count=DATA[d].exercises.filter((_,i)=>{let x=store[draftKey(w+1,d,i)];return x&&(x.done||x.skipped)}).length;
$('status').textContent=`${count}/${DATA[d].exercises.length} exercises complete · ${v.done?'✓ Completed':v.skipped?'Skipped':'In progress'} · ${db.draftIds[group]?'Session '+db.draftIds[group].slice(-6):'In progress'}`;
let past=db.sessions.filter(s=>s.day===d&&s.exercises.some(x=>x.name===e.name)).sort((a,b)=>b.created.localeCompare(a.created))[0];let old=past?.exercises.find(x=>x.name===e.name);$('previous').textContent=old?`Previous: ${old.mode==='bw'?'BW':(old.mode==='added'?'BW + ':'')+(old.weight||'—')+' lb'} · ${(old.reps||[]).join('/')} · RPE ${old.rpe||'—'}`:'No previous record';}
function weightChanged(){
 const weight=$('weight').value.trim();
 const fields=[...$('repFields').querySelectorAll('input')];
 const t=current().e.targets[current().w];
 // Entering a weight confirms the suggested target repetitions,
 // but only if the user has not already edited any repetitions.
 if(weight!=='' && fields.every(x=>x.value.trim()==='') && /^\d+$/.test(String(t.reps))){
   fields.forEach(x=>x.value=String(t.reps));
 }
 save();
}
function maybeAnchorDate(){
 if(db.firstWorkoutDate)return;
 const hasInput=$('weight').value.trim()!==''||[...$('repFields').querySelectorAll('input')].some(x=>x.value.trim()!=='')||$('actualRpe').value.trim()!=='';
 if(!hasInput)return;
 const w=Number($('week').value),d=Number($('day').value);
 const offset=((cycle-1)*6+(w-1))*28+[0,2,4,6][d];
 db.firstWorkoutDate=offsetDate(localISO(new Date()),-offset);
}
function save(){maybeAnchorDate();let {key,group}=current();let old=store[key]||{};const bwEligible=['Pull-Up','Dips','Sissy Squat','Nordic Curl'];const eligible=bwEligible.includes(current().e.name);const rawWeight=$('weight').value;let mode=eligible?(rawWeight==='0'?'bw':'added'):'weighted';let next={weight:mode==='bw'?'':rawWeight,mode,reps:[...$('repFields').querySelectorAll('input')].map(x=>x.value),rpe:$('actualRpe').value,notes:$('notes').value};let changed=['weight','mode','rpe','notes'].some(k=>String(old[k]??'')!==String(next[k]??''))||JSON.stringify(old.reps||[])!==JSON.stringify(next.reps);store[key]={...next,done:!changed&&old.done===true,skipped:!changed&&old.skipped===true};db.draftIds[group]??='draft-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);persist()}
function move(n){index=Math.max(0,Math.min(DATA[+$('day').value].exercises.length-1,index+n));render()}
function complete(){save();let {key,e,w}=current(),v=store[key],n=Number(e.targets[w].sets)||3;
const empty=v.weight===''&&v.reps.every(x=>x==='')&&v.rpe==='';
if(empty){v.reps=Array(n).fill('0');v.weight='';v.mode='weighted';v.rpe='';v.skipped=true;v.done=true;persist();move(1);return}
if(v.reps.length!==n||v.reps.some(x=>!validNumber(x)||!Number.isInteger(Number(x)))){alert(`Enter all ${n} set repetitions, or leave weight/reps/RPE empty to skip.`);return}
const skipped=v.reps.every(x=>Number(x)===0);
if(!skipped&&v.mode!=='bw'&&!validNumber(v.weight)){alert('Enter weight (0 for bodyweight exercises).');return}
if(v.rpe!==''&&(!validNumber(v.rpe)||Number(v.rpe)>10||Number(v.rpe)<1)){alert('RPE must be between 1 and 10.');return}
v.done=true;v.skipped=skipped;persist();move(1)}
function restoreDraft(id){let a=(db.archivedDrafts||[]).find(x=>x.id===id);if(!a)return;let group=`${a.week}-${a.day}`;let has=DATA[a.day].exercises.some((_,i)=>store[draftKey(a.week,a.day,i)]);if(has&&!confirm('Replace current draft? It will be archived first.'))return;if(has){db.archivedDrafts.push({id:'draft-'+Date.now(),week:a.week,day:a.day,created:new Date().toISOString(),exercises:DATA[a.day].exercises.map((x,i)=>({name:x.name,...(store[draftKey(a.week,a.day,i)]||{})}))})}a.exercises.forEach((x,i)=>{store[draftKey(a.week,a.day,i)]={...x}});db.archivedDrafts=db.archivedDrafts.filter(x=>x.id!==id);$('week').value=a.week;$('day').value=a.day;index=0;persist();switchTab('workout');render()}
function isValidISODate(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;let d=new Date(v+'T12:00:00Z');return !Number.isNaN(d.getTime())&&d.toISOString().slice(0,10)===v}
function finishDay(){
 const c=current(),d=c.d,w=c.w+1,group=`${w}-${d}`,exercises=DATA[d].exercises;
 // Do not call save() here: it can invalidate the completed flag on the last exercise.
 const missing=exercises.map((_,i)=>i).filter(i=>!store[draftKey(w,d,i)]?.done);
 if(missing.length){alert(`${missing.length}개 운동이 아직 완료되지 않았습니다. Done으로 완료하거나 생략해 주세요.`);return}
 const date=workoutDate(cycle,w,d)||localISO(new Date());
 const session={id:'s-'+Date.now()+'-'+Math.random().toString(36).slice(2,9),week:w,day:d,cycle,date,created:new Date().toISOString(),exercises:exercises.map((x,i)=>({name:x.name,...JSON.parse(JSON.stringify(store[draftKey(w,d,i)]))}))};
 db.sessions.push(session);
 exercises.forEach((_,i)=>delete store[draftKey(w,d,i)]);delete db.draftIds[group];
 let nextD=d+1,nextW=w;const wasDay4=(d===3);if(nextD>=4){nextD=0;if(w>=6){nextW=1;cycle+=1;db.activeCycle=cycle}else{nextW=w+1}}
 $('week').value=String(nextW);$('day').value=String(nextD);index=0;
 try{localStorage.setItem('justlift-last-position',JSON.stringify({week:String(nextW),day:String(nextD)}))}catch(e){}
 db.restState={finishedDate:date,wasDay4,nextSheet:`W${nextW}D${nextD+1}`};
 persist();switchTab('workout');render();restScreen();
}
function switchTab(t){$('workout').classList.toggle('hidden',t!=='workout');$('history').classList.toggle('hidden',t!=='history');$('tabW').classList.toggle('active',t==='workout');$('tabH').classList.toggle('active',t==='history');if(t==='history'){$('betweenDays').classList.add('hidden');renderHistory()}else if(db.restState){restScreen()}else{$('betweenDays').classList.add('hidden')}}
function displayWeight(x){if(x.mode==='bw')return 'BW';if(x.mode==='added')return 'BW + '+(x.weight||'0')+' lb';return x.weight!==''&&x.weight!=null?x.weight+' lb':'Not entered'}
function openSheet(w,d){
 const found=db.sessions.filter(s=>Number(s.week)===Number(w)&&Number(s.day)===Number(d)).sort((a,b)=>b.created.localeCompare(a.created))[0];
 if(found){viewSavedSession(found.id);return}
 $('week').value=String(w);$('day').value=String(d);index=0;
 try{localStorage.setItem('justlift-last-position',JSON.stringify({week:String(w),day:String(d)}))}catch(e){}
 switchTab('workout');render();
}
function viewSavedSession(id){
 const session=db.sessions.find(s=>s.id===id);if(!session)return;
 switchTab('history');cancelEdit();
 const v=$('savedViewer');v.classList.remove('hidden');
 v.innerHTML=`<div class="meta"><h3>🔒 C${session.cycle||1} W${session.week}D${session.day+1} · ${escapeHtml(session.date)}</h3><button onclick="closeSavedViewer()">✕</button></div><p class="muted">저장된 기록 · 읽기 전용</p>`+
 session.exercises.map(x=>`<div class="record"><b>${escapeHtml(x.name)}</b><div class="muted">${x.skipped?'SKIPPED':escapeHtml(displayWeight(x))} · ${escapeHtml((x.reps||[]).join(' / '))} reps · RPE ${escapeHtml(x.rpe||'—')}</div>${x.notes?`<div class="muted">${escapeHtml(x.notes)}</div>`:''}</div>`).join('')+
 `<button class="primary" onclick="editSession('${session.id}')">✎ Edit saved record</button>`;
 v.scrollIntoView({block:'start'});
}
function closeSavedViewer(){$('savedViewer').classList.add('hidden');$('savedViewer').innerHTML=''}
function renderHistory(){let groups={};db.sessions.forEach(s=>{let k=`Cycle ${s.cycle||1} / Week ${s.week} / Day ${s.day+1}`;(groups[k]??=[]).push(s)});$('list').innerHTML=Object.keys(groups).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).map(g=>`<details class="record"><summary><b>${g}</b> · ${groups[g].length} sessions</summary>${groups[g].sort((a,b)=>b.date.localeCompare(a.date)||b.created.localeCompare(a.created)).map(s=>`<details class="record"><summary>${escapeHtml(s.date)} · ${s.exercises.length} exercises ${s.edited?'· edited':''}</summary>${s.exercises.map(x=>`<p><b>${escapeHtml(x.name)}</b><br><span class="muted">${x.skipped?'SKIPPED · '+escapeHtml((x.reps||[]).join('/'))+' reps':`${escapeHtml(displayWeight(x))} · ${escapeHtml((x.reps||[]).join('/'))} reps · RPE ${escapeHtml(x.rpe||'—')}`} · ${escapeHtml(x.notes||'')}</span></p>`).join('')}<button onclick="viewSavedSession('${s.id}')">🔒 View saved record</button></details>`).join('')}</details>`).join('')||'<div class="empty">No finished days yet</div>';let archives=db.archivedDrafts||[];if(archives.length){$('list').innerHTML+='<h3>Archived drafts</h3>'+archives.slice().sort((a,b)=>b.created.localeCompare(a.created)).map(a=>`<div class="record">Week ${a.week} · Day ${a.day+1} · ${escapeHtml(a.created.slice(0,10))} <button onclick="restoreDraft(\'${a.id}\')">Restore draft</button></div>`).join('')}}
function editSession(id){let s=db.sessions.find(x=>x.id===id);if(!s)return;closeSavedViewer();editId=id;let ed=$('editor');ed.classList.remove('hidden');ed.innerHTML=`<h3>Edit saved session · ${escapeHtml(s.date)}</h3><label>Date</label><input id="editDate" type="date" value="${escapeHtml(s.date)}">`+s.exercises.map((x,i)=>`<div class="record"><b>${escapeHtml(x.name)}</b><label>Weight lb</label><input type="number" inputmode="decimal" step="0.5" id="ew${i}" value="${escapeHtml(x.mode==='bw'?'0':(x.weight??''))}"><label>Reps (one per set, separated by /)</label><input id="er${i}" value="${escapeHtml((x.reps||[]).join('/'))}"><label>RPE</label><input type="number" inputmode="decimal" step="0.5" min="1" max="10" id="ep${i}" value="${escapeHtml(x.rpe||'')}"><label>Comments</label><textarea id="en${i}">${escapeHtml(x.notes||'')}</textarea></div>`).join('')+`<button class="primary" onclick="commitEdit()">Save changes</button><button onclick="cancelEdit()">Cancel</button>`;ed.scrollIntoView({behavior:'smooth',block:'start'})}
function cancelEdit(){editId=null;$('editor').classList.add('hidden');$('editor').innerHTML=''}
function commitEdit(){let s=db.sessions.find(x=>x.id===editId);if(!s)return;let date=$('editDate').value;if(!isValidISODate(date)){alert('Enter a valid YYYY-MM-DD date');return}let revised=[];for(let i=0;i<s.exercises.length;i++){let x={...s.exercises[i]},mode=(['Pull-Up','Dips','Sissy Squat','Nordic Curl'].includes(x.name)?($('ew'+i).value==='0'?'bw':'added'):'weighted'),weight=$('ew'+i).value,reps=$('er'+i).value.split('/').map(z=>z.trim()),rpe=$('ep'+i).value,notes=$('en'+i).value,skipped=reps.length>0&&reps.every(z=>z!==''&&Number(z)===0);
{let expected=Number(DATA[s.day].exercises[i].targets[s.week-1].sets)||3;if(reps.length!==expected){alert('Expected '+expected+' sets for '+x.name);return}if(reps.some(z=>!validNumber(z)||!Number.isInteger(Number(z)))){alert('Invalid reps for '+x.name);return}if(mode!=='bw'&&!validNumber(weight)){alert('Invalid weight for '+x.name);return}}if(rpe!==''&&(!validNumber(rpe)||Number(rpe)<1||Number(rpe)>10)){alert('Invalid RPE for '+x.name);return}revised.push({...x,mode,weight:mode==='bw'?'':weight,reps,rpe,notes,skipped,done:true})}
s.date=date;s.exercises=revised;s.edited=new Date().toISOString();persist();cancelEdit();renderHistory();viewSavedSession(s.id)}
function restoreBackup(ev){let f=ev.target.files?.[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let v=JSON.parse(reader.result);if(!v.drafts||!Array.isArray(v.sessions))throw Error('Invalid backup');if(!confirm('Replace current records with backup?'))return;db={drafts:v.drafts,sessions:v.sessions,draftIds:v.draftIds||{},archivedDrafts:v.archivedDrafts||[]};store=db.drafts;persist();renderHistory();render();alert('Backup restored')}catch(e){alert('Invalid backup JSON')}};reader.readAsText(f)}
function exportData(){let a=document.createElement('a'),b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='justlift-history-v5.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

// Minimal-first interface: one primary action, secondary controls hidden until needed.
const originalRender=render;
render=function(){originalRender();const c=current(),t=c.e.targets[c.w];$('sheetId').textContent=`C${cycle} · W${c.w+1}D${c.d+1}`;
 const all=DATA[c.d].exercises.every((_,i)=>{const x=store[draftKey(c.w+1,c.d,i)];return x&&(x.done||x.skipped)});
 $('finishBtn').style.display=all?'block':'none';$('doneBtn').style.display=all?'none':'block';
 $('doneBtn').textContent=index===DATA[c.d].exercises.length-1?'Done ✓':'Done →';
 const bw=['Pull-Up','Dips','Sissy Squat','Nordic Curl'].includes(c.e.name);
 $('weightHint').textContent=bw?'0 = bodyweight · positive number = added lb':'';
 let v=store[c.key]||{};const previous=db.sessions.filter(s=>s.exercises.some(x=>x.name===c.e.name)).sort((a,b)=>b.created.localeCompare(a.created))[0];
 const past=previous?.exercises.find(x=>x.name===c.e.name);
 if(past)$('weight').placeholder=past.mode==='bw'?'0':String(past.weight||'Weight (lb)');
 $('repFields').querySelectorAll('input').forEach(x=>x.placeholder=t.reps||'Reps');
 $('actualRpe').placeholder='Optional';
 $('reuseWeight').hidden=!past; $('undoDone').hidden=!lastDoneKey;
 $('status').textContent=DATA[c.d].exercises.filter((_,i)=>store[draftKey(c.w+1,c.d,i)]?.done).length+'/'+DATA[c.d].exercises.length+' completed';
};
function smartDone(){if(!db.firstWorkoutDate){const w=Number($('week').value),d=Number($('day').value);db.firstWorkoutDate=offsetDate(localISO(new Date()),-(((cycle-1)*6+(w-1))*28+[0,2,4,6][d]));persist()}
 const doneKey=current().key;
 const c=current(),t=c.e.targets[c.w],fields=[...$('repFields').querySelectorAll('input')];
 const weight=$('weight').value.trim();
 if(weight!=='' && fields.every(f=>f.value.trim()==='')){
   const target=String(t.reps||'');
   if(/^\d+$/.test(target)){fields.forEach(f=>{f.value=target});save()}
 }
 complete();if(store[doneKey]?.done)lastDoneKey=doneKey;render();
}
let lastDoneKey=null;
function undoLastDone(){if(!lastDoneKey)return;const parts=lastDoneKey.split('-');const offset=parts[0].startsWith('C')?1:0;
if(offset)cycle=Number(parts[0].slice(1))||cycle;
$('week').value=String(parts[offset]);$('day').value=String(parts[offset+1]);index=Number(parts[offset+2]);if(store[lastDoneKey]){store[lastDoneKey].done=false;store[lastDoneKey].skipped=false}persist();lastDoneKey=null;render()}
function reuseLastWeight(){const c=current();const sessions=db.sessions.filter(s=>s.exercises.some(x=>x.name===c.e.name)).sort((a,b)=>b.created.localeCompare(a.created));const prev=sessions[0]?.exercises.find(x=>x.name===c.e.name);if(!prev)return;$('weight').value=prev.mode==='bw'?'0':(prev.weight??'');weightChanged()}
function toggleSettings(){$('settings').classList.toggle('hidden')}
// Keep the last selected week/day and return to it on launch.
const oldReset=resetExercise;
resetExercise=function(){try{localStorage.setItem('justlift-last-position',JSON.stringify({week:$('week').value,day:$('day').value}))}catch(e){}oldReset()};
try{const last=JSON.parse(localStorage.getItem('justlift-last-position')||'null');if(last&&last.week&&last.day!==undefined){$('week').value=last.week;$('day').value=last.day}}catch(e){}
const originalHistory=renderHistory;
renderHistory=function(){originalHistory();const recent=db.sessions.slice().sort((a,b)=>b.created.localeCompare(a.created)).slice(0,3);$('recentSessions').innerHTML=recent.length?'<h3>최근 운동</h3>'+recent.map(x=>`<button class="recent-link" onclick="viewSavedSession(\'${x.id}\')">W${x.week}D${x.day+1} · ${escapeHtml(x.date)} ↗</button>`).join(''):'';const nav=document.createElement('details');nav.className='record';nav.innerHTML='<summary><b>All 24 worksheets</b></summary><div class="sheet-grid">'+Array.from({length:24},(_,i)=>{let w=Math.floor(i/4)+1,d=i%4;return `<button onclick="openSheet(${w},${d})">W${w}D${d+1}</button>`}).join('')+'</div>';$('list').prepend(nav)};
render();restScreen();
</script></body></html>
